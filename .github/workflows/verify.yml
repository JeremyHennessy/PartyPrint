name: Verify PartyPrint

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install development tools
        run: npm ci
      - name: Test generators
        run: npm test
      - name: Check links and syntax
        run: npm run check
      - name: Build static site
        run: npm run build
        env:
          PUBLIC_SITE_URL: https://partyprint-5xv.pages.dev/
      - name: Verify deploy artifact
        run: |
          test -s dist/index.html
          test -s dist/src/app.js
          test -s dist/guides/baby-shower-bingo/index.html
          test -s dist/_headers
          test -s dist/assets/marketing/og-home.jpg
          test -s dist/assets/marketing/og-bridal.jpg
          test -s dist/assets/marketing/pin-baby.jpg
          test -s dist/assets/apple-touch-icon.png
          test -s dist/assets/kits/a-little-love-A4.pdf
          grep -q 'og:image.*marketing/og-home.jpg' dist/index.html
          grep -q 'og:image.*marketing/og-bridal.jpg' dist/guides/bridal-shower-games/index.html
          grep -q 'og:image:type.*image/jpeg' dist/index.html
          grep -q 'og:image.*kits/prediction-preview.png' dist/collections/a-little-love/index.html
      - name: Browser smoke and print-to-PDF
        run: bash scripts/browser-smoke.sh
      - name: Install PDF inspection tools
        run: python3 -m pip install pdfplumber==0.11.9
      - name: Verify complete Letter and A4 PDFs
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          node scripts/print-qa.mjs
          python3 scripts/verify-print.py qa
      - name: Upload visual QA samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partyprint-browser-qa
          path: qa/
          if-no-files-found: warn
          retention-days: 7
